services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fixflow
      POSTGRES_PASSWORD: fixflow
      POSTGRES_DB: fixflow
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  ai:
    build: ./ai-service
    ports: ["8000:8000"]
volumes:
  pgdata:
